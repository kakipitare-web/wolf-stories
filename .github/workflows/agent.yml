name: wolf-agent
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "ריצת ניסיון בלי פרסום"
        type: boolean
        default: false
concurrency:
  group: wolf-agent
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Jerusalem
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: |
          git config user.name "wolf-agent"
          git config user.email "wolf-agent@users.noreply.github.com"
      - name: agent
        run: python agent.py ${{ inputs.dry && '--dry-run' || '' }}
      - name: save state
        if: always()
        run: |
          git add state.json teams_he.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -qm "state" && git pull -q --rebase && git push -q)
